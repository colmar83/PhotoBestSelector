
name: Build PhotoBestSelector APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        id: project
        shell: bash
        run: |
          ZIP_PATH=$(find . -type f -iname 'PhotoBestSelector_source.zip' -print -quit)

          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: PhotoBestSelector_source.zip not found!"
            echo "Files available in repository:"
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "ZIP found: $ZIP_PATH"
          mkdir -p extracted
          unzip -q "$ZIP_PATH" -d extracted

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted" -name settings.gradle.kts -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found inside ZIP!"
            exit 1
          fi

          echo "Project folder: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoBestSelector-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
